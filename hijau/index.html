<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HAPPY BIRTHDAY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <main class="stage">
    <section class="card" id="card">
      <div class="seal" id="seal" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <defs>
            <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#9fe3c8"/>
              <stop offset="1" stop-color="#3fa98a"/>
            </linearGradient>
          </defs>
          <path fill="url(#hg)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          <g class="keyhole" fill="#fffdf3">
            <circle cx="12" cy="9.6" r="1.7"/>
            <path d="M11.2 10.6h1.6l.55 3.6h-2.7z"/>
          </g>
        </svg>
      </div>

      <h1>For you,<span>My favorite person</span></h1>
      <p class="sub">Masukkan kode dulu yaa, yg ytta ytta aja</p>

      <div class="dots" id="dots" aria-label="Kode 4 angka">
        <i></i><i></i><i></i><i></i>
      </div>

      <div class="pad" id="pad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <span></span>
        <button class="key" data-key="0">0</button>
        <button class="key del" data-key="del" aria-label="Hapus">⌫</button>
      </div>

      <p class="hint" id="hint">hint : tanggal lahir kamuu</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
