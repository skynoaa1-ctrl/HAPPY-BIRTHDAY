<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>For Abel</title>
  <link rel="stylesheet" href="page2.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <main class="stage">
    <p class="caption" id="caption">Ada sesuatu buat kamu…</p>

    <button class="gift" id="gift" aria-label="Buka kado">
      <span class="beam" id="beam"></span>
      <span class="flowers" id="flowers"></span>

      <span class="box">
        <i class="rib-v"></i>
        <i class="rib-h"></i>
      </span>

      <span class="lid" id="lid">
        <i class="rib-v"></i>
        <span class="bow"><b></b><b></b><em></em></span>
      </span>
    </button>

    <p class="tap" id="tap">Tap kotaknya 🤍</p>
  </main>

  <div class="flash" id="flash"></div>

  <script src="page2.js"></script>
</body>
</html>
